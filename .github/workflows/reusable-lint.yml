name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Check module files
        run: go mod tidy -diff
      - name: Check formatting
        run: test -z "$(gofmt -l tool tests-coverage-tool)"
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
