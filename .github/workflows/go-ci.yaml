name: Go CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/reusable-lint.yml

  test:
    name: Test
    uses: ./.github/workflows/reusable-test.yml
    secrets: inherit

  build:
    name: Build
    uses: ./.github/workflows/reusable-build.yml
