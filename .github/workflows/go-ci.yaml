name: Go CI

on:
  push:
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'


      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path:         |
                        ~/go/pkg/mod
                        ~/.cache/go-build
          key:          ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
                        ${{ runner.os }}-go-

      - name: Install deps
        run:  go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args:    --timeout=5m

      - name: Test
        run:  go test ./... -count=1
